name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Mengambil kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Menyiapkan Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Memasang dependency
        run: npm ci

      - name: Memeriksa konfigurasi repository
        run: npm run validate:config

      - name: Memeriksa kontras token warna
        run: npm run validate:contrast

      - name: Memeriksa format dan pola kode
        run: npm run lint

      - name: Memeriksa TypeScript
        run: npm run typecheck

      - name: Membuat build produksi
        run: npm run build

      # Pemeriksaan terakhir karena hasilnya bergantung pada layanan penasihat
      # keamanan npm di luar repository ini. Menempatkannya setelah pemeriksaan
      # milik sendiri membuat lint, TypeScript, dan build selalu melaporkan
      # hasilnya walaupun layanan tersebut sedang bermasalah.
      - name: Memeriksa keamanan dependency
        run: npm run audit:deps
